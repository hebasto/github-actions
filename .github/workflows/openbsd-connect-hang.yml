name: OpenBSD connect hang
on:
  push:
    paths:
      - '.github/workflows/openbsd-connect-hang.yml'
      - 'openbsd-connect-hang/**'
  workflow_dispatch:

jobs:
  openbsd:
    name: 'OpenBSD ${{ matrix.release }}, ${{ matrix.threads }} threads'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.8', '8.0']
        threads: [1, 2, 3, 4, 6, 8]
    steps:
      - uses: actions/checkout@v5

      - name: Start OpenBSD ${{ matrix.release }} VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          sync: rsync
          copyback: false

      - name: Build and run
        shell: openbsd {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openbsd-connect-hang"
          uname -a
          # Vary the thread count; give low counts more time to hit the race.
          sed -e 's/^#define THREADS .*/#define THREADS ${{ matrix.threads }}/' \
              -e 's/^#define RUN_SECONDS .*/#define RUN_SECONDS 180/' \
              connect-hang.c > connect-hang-threads.c
          grep '^#define' connect-hang-threads.c
          cc -O2 -Wall -o connect-hang connect-hang-threads.c -lpthread
          ./connect-hang
