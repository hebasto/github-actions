name: OpenBSD connect hang
on:
  push:
    paths:
      - '.github/workflows/openbsd-connect-hang.yml'
      - 'openbsd-connect-hang/**'
  workflow_dispatch:
    inputs:
      connections:
        description: 'Connections per round'
        required: true
        default: 20
        type: number
      rounds:
        description: 'Rounds'
        required: true
        default: 300
        type: number

jobs:
  openbsd:
    name: 'OpenBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.7', '7.8', '7.9', '8.0']
    steps:
      - uses: actions/checkout@v5

      - name: Start OpenBSD ${{ matrix.release }} VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          sync: rsync
          copyback: false

      - name: Build and run the reproducer
        shell: openbsd {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openbsd-connect-hang"
          uname -a
          cc -O2 -Wall -Wextra -o repro repro.c -lpthread
          ulimit -n 1024
          ./repro -n ${{ inputs.connections || 20 }} -r ${{ inputs.rounds || 300 }} -t 10

  freebsd-control:
    name: 'FreeBSD 14.3 (control)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          sync: rsync
          copyback: false

      - name: Build and run the reproducer
        shell: freebsd {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/openbsd-connect-hang"
          uname -a
          cc -O2 -Wall -Wextra -o repro repro.c -lpthread
          ulimit -n 1024
          ./repro -n ${{ inputs.connections || 20 }} -r ${{ inputs.rounds || 300 }} -t 10
