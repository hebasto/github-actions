name: CI
on: push

jobs:
  opensuse:
    runs-on: ubuntu-latest
    container: opensuse/leap:16.0

    steps:
      - run: pwd

      - run: cat /etc/os-release

      - run: printenv PATH

      - name: Install sqlite3-devel
        run: zypper --non-interactive install --allow-downgrade sqlite3-devel
