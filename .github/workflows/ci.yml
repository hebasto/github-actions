name: CI
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.7', '3.8', '3.9', '3.10', '3.11' ]

    container: python:${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4      

      - run: |
          which python || true
          which python3 || true

      - run: |
          python3 ci/test.py
