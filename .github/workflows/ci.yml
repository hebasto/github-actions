name: CI
on: push

jobs:
  OpenBSD:
    name: 'OpenBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.8']

    steps:
      - name: Start OpenBSD ${{ matrix.release }} VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          run: |
            df -h

      - shell: openbsd {0}
        run: |
          uname -a
          echo "++++++++++++++++++++++++"
          df -h
          echo "++++++++++++++++++++++++"
          ls -la /home

  OpenBSD-unbloated:
    name: 'OpenBSD ${{ matrix.release }} - unbloated'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.8']

    steps:
      - name: Clear unnecessary files on bloated GHA VM
        run: |
          df -h
          echo "++++++++++++++++++++++++"
          rm -rf /usr/share/dotnet/ /usr/local/graalvm/ /usr/local/.ghcup/ /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/android /usr/local/lib/node_modules
          echo "++++++++++++++++++++++++"
          df -h

      - name: Start OpenBSD ${{ matrix.release }} VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          run: |
            df -h

      - shell: openbsd {0}
        run: |
          uname -a
          echo "++++++++++++++++++++++++"
          df -h
          echo "++++++++++++++++++++++++"
          ls -la /home
