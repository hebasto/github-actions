on: push

jobs:
  check-error:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger an error
        id: trigger
        continue-on-error: true
        run: |
          ls .

      - name: Fallback
        if: steps.trigger.outcome == 'failure'
        run: |
          echo steps.trigger.outcome = '${{ steps.trigger.outcome }}'
          echo steps.trigger.conclusion = '${{ steps.trigger.conclusion }}'

      - name: Results
        if: ${{ always()  }}
        run: |
          echo '${{ steps.trigger.outcome }}'
          echo '${{ steps.trigger.conclusion }}'
