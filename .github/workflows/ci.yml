on: push

jobs:
  msvc:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger an error
        id: trigger
        continue-on-error: true
        run: |
          ls unknown-entity

      - name: Results
        # if: ${{ failure() && steps.demo.conclusion == 'failure' }}
        if: ${{ failure()  }}
        run: |
          echo '${{ steps.trigger.outcome }}'
          echo '${{ steps.trigger.conclusion }}'
