name: CI
on: push

jobs:
  check-os:
    runs-on: macos-14
    steps:
      - name: ${{ runner.arch }}
        run: uname -m

      - run: brew list

      - run: |
          clang --version
          sudo xcode-select --switch /Applications/Xcode_16.2.0.app
          clang --version

      - uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - run: cmake -B build
