name: CI
on: push

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['13.4', '14.2', '15.0']
    steps:
      - uses: actions/checkout@v2
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: pkg install -y cmake
          sync: 'rsync'
          copyback: false
          run: |
            cd ${{ github.workspace }}
            cmake -B build

  OpenBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.6']
    steps:
      - uses: actions/checkout@v2
      - uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: pkg_add cmake
          sync: 'rsync'
          copyback: false
          run: |
            cd ${{ github.workspace }}
            cmake -B build

  NetBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['9.4', '10.1']
    steps:
      - uses: actions/checkout@v2
      - uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: /usr/sbin/pkg_add cmake
          sync: 'rsync'
          copyback: false
          run: |
            cd ${{ github.workspace }}
            cmake -B build
