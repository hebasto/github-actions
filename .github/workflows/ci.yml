name: CI
on: push

jobs:
  NetBSD:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '9.4'
          - release: '10.1'

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: |
            echo "CHECK_OSABI=no" >> /etc/pkg_install.conf
            pkg_add -u lsof
