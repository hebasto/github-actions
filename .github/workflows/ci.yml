name: CI
on: push

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.0']
    steps:
      - uses: actions/checkout@v2
      - name: Start FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: |
            pkg update
            pkg install -y git python3 cmake
            python3 --version
          sync: no
          run: |
            git clone -c advice.detachedHead=false -b v2.2.2 https://github.com/capnproto/pycapnp
            python3 -m ensurepip
            python3 -m pip install wheel
            python3 -m pip install ./pycapnp
