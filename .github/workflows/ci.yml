name: CI
on: push

jobs:
  vcpkg:
    runs-on: windows-2022
    steps:
      - run: |
          Get-ChildItem "$env:VCPKG_ROOT"
          Get-ChildItem "$env:VCPKG_ROOT\ports"
          Get-ChildItem "$env:VCPKG_ROOT\ports\liblzma"
          Get-ChildItem "$env:VCPKG_ROOT\ports\liblzma\portfile.cmake"
