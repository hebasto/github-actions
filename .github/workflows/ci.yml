name: Check
on: push

jobs:
  netbsd:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '10.1'

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg_add cmake python313
          run: |
            python3.13 --version
            python3.13 -m ensurepip
            pip3 install --upgrade pip
            export CPPFLAGS="-DKJ_NO_EXCEPTIONS=0"
            export CFLAGS="-DKJ_NO_EXCEPTIONS=0"
            pip3 install pycapnp
