name: CI
on: push

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']
    steps:
      - name: FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg update
            pkg install -y bash curl gmake gtar
          run: |
            curl --location --fail --output source.tar.gz https://github.com/bitcoin/bitcoin/archive/refs/heads/master.tar.gz
            mkdir bitcoin_a
            tar -xf source.tar.gz -C bitcoin_a --strip-components=1
            gmake --no-print-directory -C bitcoin_a/depends build_TAR="gtar --sort=name" print-native_libmultiprocess_recipe_hash

            curl --location --fail --output source.tar.gz https://github.com/bitcoin/bitcoin/archive/refs/heads/master.tar.gz
            mkdir bitcoin_b
            tar -xf source.tar.gz -C bitcoin_b --strip-components=1
            gmake --no-print-directory -C bitcoin_b/depends build_TAR="gtar --sort=name" print-native_libmultiprocess_recipe_hash
