          - release: '9.4'
          - release: '10.1'

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: |
            # false
            true
          run: |
            # false
            true

      - run: |
          false
          true
        shell: netbsd {0}

