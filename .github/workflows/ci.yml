name: Check
on: push

jobs:
  netbsd:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '10.1'

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg_add cmake python313 py313-zmq
          run: |
            /usr/bin/which -a cmake
            echo +++++++++++++++
            /usr/bin/which python || echo "python NOT FOUND"
            python --version || echo "python NOT FOUND"
            echo +++++++++++++++
            /usr/bin/which python3 || echo "python3 NOT FOUND"
            python3 --version || echo "python NOT FOUND"
            echo +++++++++++++++
            /usr/bin/which python3.13 || echo "python3.13 NOT FOUND"
            python3.13 --version || echo "python NOT FOUND"
