name: Check
on: push

jobs:
  netbsd:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '10.1'

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg_add cmake gcc14 python313 py313-zmq capnproto
          run: |
            python3.13 --version
            python3.13 -m ensurepip
            CC=/usr/pkg/gcc14/bin/gcc python3.13 -m pip install pycapnp
            echo +++++++++++++++
            python3.13 -c "import capnp; print('pycapnp', capnp.__version__)"
