name: CI
on: push

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']
    steps:
      - name: FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          prepare: |
            pkg update
            pkg install -y bash curl gmake gtar
            tar --version
            gtar --version
            sha256sum --version
            which -a sha256sum
          run: |
            curl --location --fail --output source.tar.gz https://github.com/bitcoin/bitcoin/archive/refs/heads/master.tar.gz
            mkdir bitcoin
            tar -xf source.tar.gz -C bitcoin --strip-components=1
            echo "++++++++++++++++++++++++++++++++++++++++++++"
            ls -l bitcoin/src/ipc/libmultiprocess
            echo "++++++++++++++++++++++++++++++++++++++++++++"
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_source
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_all_sources
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_fetched
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_local_dir
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_sha256_hash
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_recipe_hash

            rm -rf bitcoin
            curl --location --fail --output source.tar.gz https://github.com/bitcoin/bitcoin/archive/refs/heads/master.tar.gz
            mkdir bitcoin
            tar -xf source.tar.gz -C bitcoin --strip-components=1
            echo "++++++++++++++++++++++++++++++++++++++++++++"
            ls -l bitcoin/src/ipc/libmultiprocess
            echo "++++++++++++++++++++++++++++++++++++++++++++"
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_source
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_all_sources
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_fetched
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_local_dir
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_sha256_hash
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_recipe_hash
