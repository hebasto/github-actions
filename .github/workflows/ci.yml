name: CI
on: push

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [ "macos-13", "macos-14"]

    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          brew list | grep python
          brew info python@3.11
          brew info python@3.12

      - run: |
          which python
          ls -l $(which python)
          python -VV || true
          which python3
          ls -l $(which python3)
          python3 -VV || true

      - run: |
          which pip3
          ls -l /usr/local/bin/pip3

      - run: |
          brew install python@3 || brew link --overwrite python@3

      - run: |
          brew list | grep python
          brew info python@3.11
          brew info python@3.12

      - run: |
          which python
          ls -l $(which python)
          python -VV || true
          which python3
          ls -l $(which python3)
          python3 -VV || true

      - run: |
          which pip3
          ls -l /usr/local/bin/pip3

      - run: |
          pip3 install --user pyzmq
