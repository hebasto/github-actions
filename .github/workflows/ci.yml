name: CI
on: [pull_request, push]

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: cmd

    steps:
      - run: where py || set ERRORLEVEL=0

      - run: py --list || set ERRORLEVEL=0

      - run: where python || set ERRORLEVEL=0

      - run: where python3 || set ERRORLEVEL=0
