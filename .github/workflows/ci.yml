name: Check
on: push

jobs:
  netbsd:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '10.1'

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg_add cmake python313 py313-pip py313-zmq
          run: |
            CXXFLAGS="-DKJ_NO_EXCEPTIONS=0" pip3.13 install pycapnp
            python3.13 --version
            python3.13 -c "import capnp; print('pycapnp', capnp.__version__)"
            python3.13 -c "import zmq; print('pyzmq', zmq.__version__)"
