on: push

jobs:
  matrix_names:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env_vars:
          - WIDEMUL: 'int64'
            RECOVERY: 'yes'
          - BUILD: 'distcheck'
            WITH_VALGRIND: 'no'
          - ECMULTGENPRECISION: 8
            ECMULTWINDOW: 4
        cc: ['gcc', 'clang']

    env:
      CC: ${{ matrix.cc }}

    steps:
      - run: |
          echo "WIDEMUL=${{ matrix.env_vars.WIDEMUL }}"
          echo "RECOVERY=${{ matrix.env_vars.RECOVERY }}"
          echo "BUILD=${{ matrix.env_vars.BUILD }}"
          echo "WITH_VALGRIND=${{ matrix.env_vars.WITH_VALGRIND }}"
          echo "ECMULTGENPRECISION=${{ matrix.env_vars.ECMULTGENPRECISION }}"
          echo "ECMULTWINDOW=${{ matrix.env_vars.ECMULTWINDOW }}"

          printenv CC
