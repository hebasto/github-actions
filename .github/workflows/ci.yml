name: CI
on: push

jobs:
  # Default == pwsh, PowerShell Core 7.4.10.
  windows-default:
    runs-on: windows-latest
    steps:
      - run: |
          Write-Host "PowerShell version $($PSVersionTable.PSVersion.ToString())"
          Write-Host "Before the error"
          Get-Item "C:\NonExistentFile.txt"
          Write-Host "After the error"

  windows-default-plus:
    runs-on: windows-latest
    steps:
      # GHA prepends $ErrorActionPreference = 'stop' to script contents.
      # https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
      - run: |
          Write-Host "PowerShell version $($PSVersionTable.PSVersion.ToString())"
          $ErrorActionPreference = 'Stop'
          Write-Host "Before the error"
          Get-Item "C:\NonExistentFile.txt"
          Write-Host "After the error"

  windows-pwsh:
    runs-on: windows-latest
    steps:
      - run: |
          Write-Host "PowerShell version $($PSVersionTable.PSVersion.ToString())"
          Write-Host "Before the error"
          Get-Item "C:\NonExistentFile.txt"
          Write-Host "After the error"
        shell: pwsh

  windows-pwsh-plus:
    runs-on: windows-latest
    steps:
      - run: |
          Write-Host "PowerShell version $($PSVersionTable.PSVersion.ToString())"
          $ErrorActionPreference = 'Stop'
          Write-Host "Before the error"
          Get-Item "C:\NonExistentFile.txt"
          Write-Host "After the error"
        shell: pwsh

  windows-powershell:
    runs-on: windows-latest
    steps:
      - run: |
          Write-Host "PowerShell version $($PSVersionTable.PSVersion.ToString())"
          Write-Host "Before the error"
          Get-Item "C:\NonExistentFile.txt"
          Write-Host "After the error"
        shell: powershell

  windows-powershell-plus:
    runs-on: windows-latest
    steps:
      - run: |
          Write-Host "PowerShell version $($PSVersionTable.PSVersion.ToString())"
          $ErrorActionPreference = 'Stop'
          Write-Host "Before the error"
          Get-Item "C:\NonExistentFile.txt"
          Write-Host "After the error"
        shell: powershell

