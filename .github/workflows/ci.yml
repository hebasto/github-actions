name: OpenIndiana Performance Regression DEMO
on: push

jobs:
  openindiana_v108:
    name: 'OpenIndiana v1.0.8'
    runs-on: ubuntu-latest
    steps:
      - uses: vmactions/openindiana-vm@v1.0.8
        with:
          release: '202510-build'
          sync: 'no'

      - shell: openindiana {0}
        run: |
          if gcc -v 2>&1 | grep -q -- --disable-bootstrap; then
            echo "::warning title=gcc::Compiler was built without bootstrap (unoptimized)."
          else
            echo "gcc is bootstrapped."
          fi

  openindiana_v109:
    name: 'OpenIndiana v1.0.9'
    runs-on: ubuntu-latest
    steps:
      - uses: vmactions/openindiana-vm@v1.0.9
        with:
          release: '202510-build'
          sync: 'no'
          prepare: |
            pkg install developer/gcc-13
      - shell: openindiana {0}
        run: |
          if gcc -v 2>&1 | grep -q -- --disable-bootstrap; then
            echo "::warning title=gcc::Compiler was built without bootstrap (unoptimized)."
          else
            echo "gcc is bootstrapped."
          fi

          if gcc-13 -v 2>&1 | grep -q -- --disable-bootstrap; then
            echo "::warning title=gcc-13::Compiler was built without bootstrap (unoptimized)."
          else
            echo "gcc-13 is bootstrapped."
          fi
