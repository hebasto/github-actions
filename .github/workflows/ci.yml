name: CI
on: push

jobs:
  windows:
    runs-on: windows-2025

    steps:
      - shell: cmd
        run: where clang-cl

      - shell: cmd
        run: clang-cl -print-resource-dir

      - shell: cmd
        run: dir "C:\Program Files\LLVM\lib\clang\20"

      - shell: cmd
        run: dir "C:\Program Files\LLVM\lib\clang\20\lib\windows"

      - uses: actions/checkout@v6

      - run: cmake -B build
