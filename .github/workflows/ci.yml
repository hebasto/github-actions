name: CI
on: push

jobs:
  check-os:
    name: "Hello macOS"
    runs-on: macos-13
    steps:
      - run: |
          python -VV || true
          python3 -VV || true

      - run: |
          which pip3
          ls -l /usr/local/bin/pip3

      - run: |
          brew install python@3 || brew link --overwrite python@3

      - run: |
          python -VV || true
          python3 -VV || true

      - run: |
          which pip3
          ls -l /usr/local/bin/pip3

      - run: |
          pip3 install --user pyzmq
