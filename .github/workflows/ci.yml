name: CI
on: push

jobs:
  OpenIndiana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start OpenIndiana VM
        uses: vmactions/openindiana-vm@v0
        with:
          sync: no

      - name: Custom shell step 1
        shell: openindiana {0}
        run: |
          pwd
          echo $0
          which -a sh

      - name: Custom shell step 2
        shell: openindiana {0}
        run: |
          pwd
          cd ${{ github.workspace }}
          pwd

      - name: Custom shell step 3
        shell: openindiana {0}
        run: |
          pwd
          cd $GITHUB_WORKSPACE
          pwd
