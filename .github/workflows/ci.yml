name: CI
on: push

jobs:
  macos:
    runs-on: xcode-27
    steps:
      - run: |
          clang --version
          xcode-select -p
          xcrun --show-sdk-version
          xcrun --show-sdk-path
          grep -C 5 -n pipe2 "$(xcrun --show-sdk-path)/usr/include/sys/unistd.h"

      - uses: actions/checkout@v7

      - run: |
          cmake -B build
