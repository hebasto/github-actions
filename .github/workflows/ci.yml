# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on: [pull_request, push]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Win64 native, VS 2022
    runs-on: windows-2022
    steps:
      - name: Demo for cmd shell
        # These two commands are being executed in different shells.
        run: cd %VCPKG_INSTALLATION_ROOT% && dir
        shell: cmd

      - name: Demo for default shell
        run: |
          Set-Location "$env:VCPKG_INSTALLATION_ROOT"
          Get-ChildItem
          git rev-parse HEAD

      - name: Job nmae
        run: |
          Write-Host ${{ github.job }}
          Write-Host ${{ github.job.name }}
