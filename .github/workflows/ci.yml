name: Check
on: push

jobs:
  freebsd:
    name: 'FreeBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '14.4'
          - release: '15.1'

    steps:
      - name: Start FreeBSD ${{ matrix.release }} VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg update
            pkg install -y cmake-core python3 devel/py-pip net/py-pyzmq databases/py-sqlite3
          run: |
            pip install pycapnp
            python3 --version
            python3 -c "import sqlite3; print(f'SQLite {sqlite3.sqlite_version}')"
            python3 -c "import capnp; print(f'pycapnp {capnp.__version__} / libcapnp {capnp.version.LIBCAPNP_VERSION_MAJOR}.{capnp.version.LIBCAPNP_VERSION_MINOR}.{capnp.version.LIBCAPNP_VERSION_MICRO}')"
            python3 -c "import zmq; print(f'pyzmq {zmq.__version__} / libzmq {zmq.zmq_version()}')"
