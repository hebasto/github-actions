name: OpenIndiana Performance Regression DEMO
on: push

jobs:
  openindiana_v108:
    name: 'OpenIndiana v1.0.8'
    runs-on: ubuntu-latest
    steps:
      - uses: vmactions/openindiana-vm@v1.0.8
        with:
          release: '202510-build'
          sync: 'no'
          run: |
            psrinfo -pv
            isainfo -v
            kstat -p cpu_info | grep -E 'brand|implementation|chip_id|clock_MHz'
  openindiana_v116:
    name: 'OpenIndiana v1.1.6'
    runs-on: ubuntu-latest
    steps:
      - uses: vmactions/openindiana-vm@v1.1.6
        with:
          release: '202510-build'
          sync: 'no'
          run: |
            psrinfo -pv
            isainfo -v
            kstat -p cpu_info | grep -E 'brand|implementation|chip_id|clock_MHz'
