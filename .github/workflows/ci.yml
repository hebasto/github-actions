name: Check
on: push

jobs:
  freebsd:
    name: 'FreeBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '14.4'
          - release: '15.1'

    steps:
      - name: Start FreeBSD ${{ matrix.release }} VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg update
            pkg install -y cmake-core python3 net/py-pyzmq databases/py-sqlite3
          run: |
            python3 -m ensurepip
            pip3 install --upgrade pip
            pip3 install pycapnp
            python3 --version
            python3 -c "import capnp; print('pycapnp', capnp.__version__)"
            python3 -c "import zmq; print('pyzmq', zmq.__version__, '/ libzmq', zmq.zmq_version())"
            python3 -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"
            python3 -c "from capnp import version as v; import capnp; print('pycapnp', capnp.__version__, '/ libcapnp', f'{v.LIBCAPNP_VERSION_MAJOR}.{v.LIBCAPNP_VERSION_MINOR}.{v.LIBCAPNP_VERSION_MICRO}')"
            python3 -c "import capnp; print(f'pycapnp {capnp.__version__} / libcapnp {version.LIBCAPNP_VERSION_MAJOR}.{version.LIBCAPNP_VERSION_MINOR}.{version.LIBCAPNP_VERSION_MICRO}')"
