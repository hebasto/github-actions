name: CI
on: [pull_request, push]

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v3

      - run: echo %PATH%

      - run: where py

      - run: py --list

      - run: where python

      - run: where python3

      - run: py print-version.py

      - run: py -3 print-version.py

      - run: python print-version.py

      - run: python3 print-version.py

      - run: py --version

      - run: py -3 --version

      - run: python --version

      - run: python3 --version
