name: CI
on: push

jobs:
  NetBSD:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '9.4'
          - release: '10.1'

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: |
            pkg_add -u python314
          run: |
            python3.14 --version
            python3.14 -m pip install pyzmq
            python3.14 -m ensurepip
            python3.14 -m pip install pyzmq
