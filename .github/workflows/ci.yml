name: OpenIndiana locale bug
on: push

jobs:
  openindiana:
    name: 'OpenIndiana'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/openindiana-vm@v1
        with:
          release: '202604'
          prepare: |
            pkg install developer/gcc-14
      - name: Test g++-14 with C.UTF-8 locale, should FAIL
        shell: openindiana {0}
        run: |
          g++-14 -v
          g++-14 -std=c++20 test.cpp -o test
          LANG=C.UTF-8 LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards ./test
          mdb ./test core <<'EOF'
          $G
          ::status
          $C
          EOF
