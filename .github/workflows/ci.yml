name: CI
on: push

jobs:
  NetBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          prepare: |
            cd /usr
            cvs -danoncvs@anoncvs.NetBSD.org:/cvsroot checkout -P \
                pkgsrc/devel/pcre2 \
                pkgsrc/mk \
                pkgsrc/archivers/bzip2 \
                pkgsrc/devel/zlib \
                pkgsrc/lang/gcc15
          run: |
            pkg_add digest libtool-base mktools cwrappers
            env -u PKG_PATH make -C /usr/pkgsrc/devel/pcre2 replace
          sync: no
