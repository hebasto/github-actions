on: push

jobs:
  matrix_names:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env_vars:
          - { WIDEMUL: 'int64', RECOVERY: 'yes' }
          - { BUILD: 'distcheck', WITH_VALGRIND: 'no' }
          - { ECMULTGENPRECISION: 8, ECMULTWINDOW: 4 }
        cc:
          - 'gcc'
          - 'clang'

    env:
      CC: ${{ matrix.cc }}

    # env:
      VARIABLE: 'a nice value of 42'

    steps:
      - run: |
          echo "matrix.env_vars=${{ matrix.env_vars }}"
          echo "matrix.env_vars=${{ toJSON(matrix.env_vars) }}"

          printenv CC
