name: CI
on: push

jobs:
  autotools:
    name: 'OpenBSD ${{ matrix.release }}, Autotools'
    runs-on: ubuntu-latest
    strategy: &RELEASE_MATRIX
      fail-fast: false
      matrix:
        release: ['7.8', '7.9']

    steps:
      - &START_VM
        name: Start OpenBSD ${{ matrix.release }} VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no

      - name: Install build dependencies
        shell: openbsd {0}
        run: pkg_add curl gmake gtar--

      - &FETCH_SOURCE
        name: Fetch source tarball
        shell: openbsd {0}
        run: |
          set -e
          curl --location --fail --output source.tar.gz https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.gz
          mkdir /home/freetype
          gtar -xf source.tar.gz -C /home/freetype --strip-components=1
          rm -rf source.tar.gz

      - name: Build with Autotools
        shell: openbsd {0}
        run: |
          set -e
          cd /home/freetype
          ./configure --prefix=/home/INSTALL --disable-static
          gmake -j 4
          gmake install

      - name: Result
        shell: openbsd {0}
        run: ls -l /home/INSTALL/lib

  cmake:
    name: 'OpenBSD ${{ matrix.release }}, CMake'
    runs-on: ubuntu-latest
    strategy: *RELEASE_MATRIX

    steps:
      - *START_VM

      - name: Install build dependencies
        shell: openbsd {0}
        run: pkg_add cmake curl gmake gtar--

      - *FETCH_SOURCE

      - name: Build with CMake
        shell: openbsd {0}
        run: |
          set -e
          cmake -S /home/freetype -B /home/build -DCMAKE_INSTALL_PREFIX=/home/INSTALL -DBUILD_SHARED_LIBS=ON
          cd /home/build
          cmake --build . -j 4
          cmake --install .

      - name: Result
        shell: openbsd {0}
        run: ls -l /home/INSTALL/lib
