name: CI
on: push

jobs:
  freebsd:
    runs-on: ubuntu-latest
    strategy: &MATRIX
      fail-fast: false
      matrix:
        clear: [true, false]

    steps:
      - &CLEAR_HOST
        if: matrix.clear
        run: >
          sudo rm -rf
          /usr/share/dotnet/
          /usr/local/graalvm/
          /usr/local/.ghcup/
          /usr/local/share/powershell
          /usr/local/share/chromium
          /usr/local/lib/android
          /usr/local/lib/node_modules

      - &CHECK_HOST
        run: df -h

      - uses: vmactions/freebsd-vm@v1
        with:
          sync: no
          run: df -h

  openbsd:
    runs-on: ubuntu-latest
    strategy: *MATRIX
    steps:
      - *CLEAR_HOST
      - *CHECK_HOST
      - uses: vmactions/openbsd-vm@v1
        with:
          sync: no
          run: df -h

  netbsd:
    runs-on: ubuntu-latest
    strategy: *MATRIX
    steps:
      - *CLEAR_HOST
      - *CHECK_HOST
      - uses: vmactions/netbsd-vm@v1
        with:
          sync: no
          run: df -h
