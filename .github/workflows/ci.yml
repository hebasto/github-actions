name: DEMO
on: push

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']
    steps:
      - name: FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg update
            pkg install -y bash git gmake py312-diffoscope

      - shell: freebsd {0}
        run: |
          git clone --depth=1 https://github.com/hebasto/bitcoin -b 260629-depends-sort a
          ls -l a/src/ipc/libmultiprocess
          cd a/depends
          gmake print-native_libmultiprocess_sha256_hash

      - shell: freebsd {0}
        run: |
          git clone --depth=1 https://github.com/hebasto/bitcoin -b 260629-depends-sort b
          ls -l b/src/ipc/libmultiprocess
          cd b/depends
          gmake print-native_libmultiprocess_sha256_hash

      - shell: freebsd {0}
        run: |
          diffoscope a/depends/sources/src-ipc-libmultiprocess.tar b/depends/sources/src-ipc-libmultiprocess.tar
