name: CI
on: push

jobs:
  windows:
    runs-on: windows-11-arm

    steps:
      - shell: cmd
        run: where clang-cl

      - shell: cmd
        run: clang-cl -print-resource-dir

      - shell: cmd
        run: dir "C:\Program Files\LLVM"

      - shell: cmd
        run: dir "C:\Program Files\LLVM\lib"

      - shell: cmd
        run: dir "C:\Program Files\LLVM\lib\clang"
