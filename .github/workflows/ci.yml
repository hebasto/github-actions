name: CI
on: push

jobs:
  OpenBSD:
    name: 'OpenBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.8']

    steps:
      - name: Start OpenBSD ${{ matrix.release }} VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          run: |
            df -h

      - shell: openbsd {0}
        run: |
          df -h
          echo "++++++++++++++++++++++++"
          ls -la /home
