name: check
on: push

jobs:
  pycapnp:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pycapnp
        run: pip install pycapnp

      - name: Smoke test <-- Check THIS out!
        run: |
          python --version
          python -c "import capnp; print('pycapnp', capnp.__version__)"
