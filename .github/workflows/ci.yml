name: CI
on: push

jobs:
  fedora-41:
    runs-on: ubuntu-latest
    container: fedora:41

    steps:
      - run: |
          dnf install -y which

      - run: |
          which -a awk

  fedora-42:
    runs-on: ubuntu-latest
    container: fedora:42

    steps:
      - run: |
          dnf install -y which

      - run: |
          which -a awk
