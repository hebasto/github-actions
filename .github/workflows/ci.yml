name: CI
on: push

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']
    steps:
      - name: FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg update
            pkg install -y bash git gmake gtar
          run: |
            git clone https://github.com/bitcoin/bitcoin.git bitcoin_a
            gmake --no-print-directory -C bitcoin_a/depends print-native_libmultiprocess_recipe_hash

            git clone https://github.com/bitcoin/bitcoin.git bitcoin_b
            gmake --no-print-directory -C bitcoin_b/depends print-native_libmultiprocess_recipe_hash
