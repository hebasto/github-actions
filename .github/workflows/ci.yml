name: CI
on: push

jobs:
  NetBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          prepare: |
            pkg_info > packages_before
            echo "+++++++++++++++++++++++++++ prepare 00"
            pkg_add git-base
            echo "+++++++++++++++++++++++++++ prepare 01"
            pkg_info > packages_after
            echo "+++++++++++++++++++++++++++ prepare 02"
            diff -w packages_before packages_after | grep '^>'
            echo "+++++++++++++++++++++++++++ prepare 03"
          sync: no
