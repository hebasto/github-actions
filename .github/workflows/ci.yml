name: CI
on: push

env:
  TMPDIR: '${{ github.workspace }}/ci_tmp'

jobs:
  NetBSD:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: netbsd {0}

    steps:
      - uses: actions/checkout@v6
      - name: Start NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          envs: 'TMPDIR'
          prepare: |
            echo "+++++++++++++++++++++++++++++++++"
            mkdir "${{ github.workspace }}/ci_tmp"
            echo "+++++++++++++++++++++++++++++++++"
            export TMPDIR="${{ github.workspace }}/ci_tmp"
            echo "+++++++++++++++++++++++++++++++++"
            printenv TMPDIR
            echo "+++++++++++++++++++++++++++++++++"
            env | sort
          sync: no

      - run: |
          echo "+++++++++++++++++++++++++++++++++"
          echo "=== $TMPDIR ==="
          echo "+++++++++++++++++++++++++++++++++"
          env | sort

      - run: |
          echo "+++++++++++++++++++++++++++++++++"
          echo "=== $TMPDIR ==="
          echo "+++++++++++++++++++++++++++++++++"
          env | sort
