on: push

jobs:
  docker:
    # name: 'Build image'
    runs-on: ubuntu-latest
    steps:
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v2

      - uses: docker/build-push-action@v4
        with:
          file: ./Dockerfile
          tags: ci-image
          push: false
          load: true
          # cache-from: type=gha
          # cache-to: type=gha,mode=min

      - run: docker images

      - run: >
          docker run ci-image bash -c " \
            cat /etc/os-release && \
            ( printenv HEBA || true ) && \
            export HEBA=42 && \
            ( printenv HEBA || true ) \
          "

      - run: >
          docker run ci-image bash -c " \
            ( printenv HEBA || true ) \
          "
