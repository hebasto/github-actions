name: CI
on: push

jobs:
  opensuse:
    runs-on: ubuntu-latest
    container: opensuse/leap:16.0

    steps:
      - run: pwd

      - run: cat /etc/os-release

      - run: printenv PATH

      - name: Check currently enabled repositories
        run: zypper lr -d

      - name: Add update repository
        run: zypper ar -cfg 'http://download.opensuse.org/update/leap/16.0/oss/' repo-update

      - name: Check currently enabled repositories
        run: zypper lr -d
