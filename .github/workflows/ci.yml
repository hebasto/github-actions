name: CI
on: push

jobs:
  netbsd-base:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['10.2', '11.0']

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: pkg_add -u boost
          sync: no
          disable-cache: true

      - shell: netbsd {0}
        run: |
          grep -rn "INCLUDE" /usr/pkg/lib/cmake/boost_headers-*/boost_headers-config.cmake
          pkg_info boost | head -3
          pkg_info -B boost

  netbsd-q2:
    name: 'NetBSD 10.0_2026Q2'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['10.2']

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: |
            export PKG_PATH="https://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/10.0_2026Q2/All"
            pkg_add -u -v boost
          sync: no
          disable-cache: true

      - shell: netbsd {0}
        run: |
          grep -rn "INCLUDE" /usr/pkg/lib/cmake/boost_headers-*/boost_headers-config.cmake
          pkg_info boost | head -3
          pkg_info -B boost

  netbsd-q3:
    name: 'NetBSD 10.0_2026Q3'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['10.2']

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: |
            export PKG_PATH="https://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/x86_64/10.0_2026Q3/All"
            pkg_add -u -v boost
          sync: no
          disable-cache: true

      - shell: netbsd {0}
        run: |
          grep -rn "INCLUDE" /usr/pkg/lib/cmake/boost_headers-*/boost_headers-config.cmake
          pkg_info boost | head -3
          pkg_info -B boost
