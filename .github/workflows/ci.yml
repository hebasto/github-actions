name: CI
on: push

jobs:
  NetBSD:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['10.2', '11.0']

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: pkg_add -u boost
          sync: no
          disable-cache: true
          run: |
            echo "=== ${PKG_PATH-<unset>} ==="
            cat /etc/pkg_install.conf 2>/dev/null
            cat /usr/pkg/etc/pkgin/repositories.conf 2>/dev/null
