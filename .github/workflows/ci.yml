name: CI
on: push

jobs:
  windows-default:
    runs-on: windows-latest
    steps:
      - run: |
          Write-Host "Before the error"
          py -3 -c "import sys; sys.exit(1)"
          Write-Host "Exit code: $LASTEXITCODE"
          Write-Host "After the error"
          py -3 -c "import sys; sys.exit(0)"
          Write-Host "Exit code: $LASTEXITCODE"

  windows-default-plus:
    runs-on: windows-latest
    steps:
      - run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Before the error"
          py -3 -c "import sys; sys.exit(1)"
          Write-Host "Exit code: $LASTEXITCODE"
          Write-Host "After the error"
          py -3 -c "import sys; sys.exit(0)"
          Write-Host "Exit code: $LASTEXITCODE"

  windows-pwsh:
    runs-on: windows-latest
    steps:
      - run: |
          Write-Host "Before the error"
          py -3 -c "import sys; sys.exit(1)"
          Write-Host "Exit code: $LASTEXITCODE"
          Write-Host "After the error"
          py -3 -c "import sys; sys.exit(0)"
          Write-Host "Exit code: $LASTEXITCODE"
        shell: pwsh

  windows-pwsh-plus:
    runs-on: windows-latest
    steps:
      - run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Before the error"
          py -3 -c "import sys; sys.exit(1)"
          Write-Host "Exit code: $LASTEXITCODE"
          Write-Host "After the error"
          py -3 -c "import sys; sys.exit(0)"
          Write-Host "Exit code: $LASTEXITCODE"
        shell: pwsh

  windows-powershell:
    runs-on: windows-latest
    steps:
      - run: |
          Write-Host "Before the error"
          py -3 -c "import sys; sys.exit(1)"
          Write-Host "Exit code: $LASTEXITCODE"
          Write-Host "After the error"
          py -3 -c "import sys; sys.exit(0)"
          Write-Host "Exit code: $LASTEXITCODE"
        shell: powershell

  windows-powershell-plus:
    runs-on: windows-latest
    steps:
      - run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Before the error"
          py -3 -c "import sys; sys.exit(1)"
          Write-Host "Exit code: $LASTEXITCODE"
          Write-Host "After the error"
          py -3 -c "import sys; sys.exit(0)"
          Write-Host "Exit code: $LASTEXITCODE"
        shell: powershell

