name: CI
on: push

jobs:
  NetBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          prepare: |
            pkg_add digest libtool-base mktools cwrappers
            cd /usr
            CVS_RSH=ssh cvs -danoncvs@anoncvs.NetBSD.org:/cvsroot checkout -P pkgsrc/devel/pcre2
            env -u PKG_PATH make -C pkgsrc/devel/pcre2/ replace
          sync: no
