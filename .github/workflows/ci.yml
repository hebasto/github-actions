name: CI
on: push

jobs:
  autotools:
    name: 'OpenBSD ${{ matrix.release }}, Autotools, ${{ matrix.name }}'
    runs-on: ubuntu-latest
    strategy: &RELEASE_MATRIX
      fail-fast: false
      matrix:
        release: ['7.8', '7.9']
        name: ['master', 'PR']
        include:
          - name: 'master'
            url: 'https://gitlab.freedesktop.org/freetype/freetype.git'
            branch: 'master'
          - name: 'PR'
            url: 'https://gitlab.freedesktop.org/hebasto/freetype.git'
            branch: '260602-cmake-bsd'

    steps:
      - &START_VM
        name: Start OpenBSD ${{ matrix.release }} VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no

      - name: Install build dependencies
        shell: openbsd {0}
        run: pkg_add autoconf%2.72 automake%1.18 curl git gmake gtar-- libtool

      - &FETCH_SOURCE
        name: Fetch source
        shell: openbsd {0}
        run: |
          set -e
          git clone ${{ matrix.url }} /home/freetype
          cd /home/freetype
          git switch ${{ matrix.branch }}

      - name: Build with Autotools
        shell: openbsd {0}
        run: |
          set -e
          cd /home/freetype
          export AUTOCONF_VERSION=2.72
          export AUTOMAKE_VERSION=1.18
          ./autogen.sh
          ./configure --prefix=/home/INSTALL --disable-static
          gmake -j 4
          gmake install

      - name: Result
        shell: openbsd {0}
        run: ls -l /home/INSTALL/lib

  cmake:
    name: 'OpenBSD ${{ matrix.release }}, CMake, ${{ matrix.name }}'
    runs-on: ubuntu-latest
    strategy: *RELEASE_MATRIX

    steps:
      - *START_VM

      - name: Install build dependencies
        shell: openbsd {0}
        run: pkg_add cmake curl git gmake gtar--

      - *FETCH_SOURCE

      - name: Build with CMake
        shell: openbsd {0}
        run: |
          set -e
          cmake -S /home/freetype -B /home/build -DCMAKE_INSTALL_PREFIX=/home/INSTALL -DBUILD_SHARED_LIBS=ON
          cd /home/build
          cmake --build . -j 4
          cmake --install .

      - name: Result
        shell: openbsd {0}
        run: ls -l /home/INSTALL/lib
