name: DEMO
on: push

jobs:
  freebsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']

    steps:
      - name: FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg update
            pkg install -y bash git gmake

      - shell: freebsd {0}
        run: |
          git clone --depth=1 https://github.com/hebasto/bitcoin -b 260629-depends-sort a
          cd a/depends
          gmake print-native_libmultiprocess_sha256_hash

      - run: sleep 2

      - shell: freebsd {0}
        run: |
          git clone --depth=1 https://github.com/hebasto/bitcoin -b 260629-depends-sort b
          cd b/depends
          gmake print-native_libmultiprocess_sha256_hash
