name: CI
on: push

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['13.4', '14.2', '15.0']
    steps:
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: 'rsync'
          copyback: false
          run: |
            mount

  OpenBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.6']
    steps:
      - uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: 'rsync'
          copyback: false
          run: |
            mount

  NetBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['9.4', '10.1']
    steps:
      - uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: 'rsync'
          copyback: false
          run: |
            mount
