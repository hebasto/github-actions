name: CI
on: push

jobs:
  OpenBSD_1:
    name: 'OpenBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy: &RELEASE_MATRIX
      fail-fast: false
      matrix:
        release: [7.7, 7.8]

    steps:
      - name: Start OpenBSD ${{ matrix.release }} VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: pkg_add -v capnproto
          sync: no

      - shell: openbsd {0}
        run: |
          uname -a
          clang -v

  OpenBSD_2:
    name: 'OpenBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy: *RELEASE_MATRIX

    steps:
      - name: Start OpenBSD ${{ matrix.release }} VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          prepare: pkg_add -v capnproto
          sync: no

      - shell: openbsd {0}
        run: |
          uname -a
          clang -v
