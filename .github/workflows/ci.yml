name: CI
on: push

jobs:
  reproduce_issue35981:
    runs-on: macos-14
    steps:
      - run: brew list

      - run: |
          clang --version
          sudo xcode-select --switch /Applications/Xcode_16.2.0.app
          clang --version

      - run: |
          /usr/bin/c++ --version
          ls -l /usr/bin/

      - run: |
          xcrun --show-sdk-path
          ls -l "$(xcrun --show-sdk-path)"
          ls -l "$(xcrun --show-sdk-path)"/usr
          echo ++++++++++++++++++
          ls -l "$(xcrun --show-sdk-path)"/usr/include/c++/v1

      - run: |
          clang -v -E -x c /dev/null 2>&1 | grep -A5 'search starts'
          echo =======================================================
          clang++ -v -E -x c++ /dev/null 2>&1 | grep -A5 'search starts'

      - uses: actions/checkout@v7
        with:
          repository: bitcoin/bitcoin

      - name: Install Homebrew's packages
        run: |
          brew untap aws/tap
          brew update
          brew install cmake boost capnp

      - run: cmake --version

      - run: env | sort

      - run: env | grep -iE 'cpath|cplus_include|c_include|sdkroot|library_path' | sort

      - run: |
          echo 'message("CMAKE_OSX_SYSROOT is ${CMAKE_OSX_SYSROOT}")' >> CMakeLists.txt
          cmake -B build

      - run: cat build/CMakeFiles/CMakeConfigureLog.yaml
