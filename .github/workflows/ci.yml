name: CI
on: push

jobs:
  check-os:
    name: "Hello macOS"
    runs-on: macos-13
    steps:
      - run: |
          brew list | grep python
          brew info python@3.11
          brew info python@3.12

      - run: |
          brew uninstall --ignore-dependencies python@3.11 python@3.12

      - run: |
          brew install python@3
