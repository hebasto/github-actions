name: illumos-based OS locale bug
on: push

jobs:
  openindiana:
    name: 'OpenIndiana'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/openindiana-vm@v1
        with:
          prepare: |
            pkg install developer/gcc-13
            pkg install developer/gcc-14
      - shell: openindiana {0}
        run: |
          gcc-13 -v
          if gcc-13 -v 2>&1 | grep -q -- --disable-bootstrap; then
            echo "::warning title=gcc-13::gcc-13 was built without bootstrap (unoptimized)."
          else
            echo "gcc-13 is bootstrapped."
          fi
          if gcc-13 -v 2>&1 | grep -o -e '--enable-clocale=[^ ]*'; then
            echo "::warning title=gcc-13::gcc-13 was built with configured clocale backend."
          else
            echo "gcc-13 has the default clocale backend."
          fi
          echo "---"
          gcc-14 -v
          if gcc-14 -v 2>&1 | grep -q -- --disable-bootstrap; then
            echo "::warning title=gcc-14::gcc-14 was built without bootstrap (unoptimized)."
          else
            echo "gcc-14 is bootstrapped."
          fi
          if gcc-14 -v 2>&1 | grep -o -e '--enable-clocale=[^ ]*'; then
            echo "::warning title=gcc-14::gcc-14 was built with configured clocale backend."
          else
            echo "gcc-14 has the default clocale backend."
          fi
      - run: locale
      - name: Test g++-13 with C locale, should PASS
        if: always()
        shell: openindiana {0}
        run: |
          g++-13 -v
          g++-13 -std=c++20 test.cpp -o test
          LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards LANG=C ./test
      - name: Test g++-13 with C.UTF-8 locale, should PASS
        if: always()
        shell: openindiana {0}
        run: |
          g++-13 -v
          g++-13 -std=c++20 test.cpp -o test
          LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards LANG=C.UTF-8 ./test
      - name: Test g++-14 with C locale, should PASS
        if: always()
        shell: openindiana {0}
        run: |
          g++-14 -v
          g++-14 -std=c++20 test.cpp -o test
          LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards LANG=C ./test
      - name: Test g++-14 with C.UTF-8 locale, should FAIL
        if: always()
        shell: openindiana {0}
        run: |
          g++-14 -v
          g++-14 -std=c++20 test.cpp -o test
          LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards LANG=C.UTF-8 ./test
          mdb core <<'EOF'
          ::status
          $C
          EOF

  omnios:
    name: 'OmniOS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/omnios-vm@v1
        with:
          prepare: |
            pkg install developer/gcc14 developer/gcc15
      - shell: omnios {0}
        run: |
          gcc-14 -v
          if gcc-14 -v 2>&1 | grep -o -e '--enable-clocale=[^ ]*'; then
            echo "::warning title=gcc-14::gcc-14 was built with configured clocale backend."
          else
            echo "gcc-14 has the default clocale backend."
          fi
          echo "---"
          gcc-15 -v
          if gcc-15 -v 2>&1 | grep -o -e '--enable-clocale=[^ ]*'; then
            echo "::warning title=gcc-15::gcc-15 was built with configured clocale backend."
          else
            echo "gcc-15 has the default clocale backend."
          fi
      - run: locale
      - name: Test g++-14 with C locale, should PASS
        if: always()
        shell: omnios {0}
        run: |
          g++-14 -v
          g++-14 -std=c++20 test.cpp -o test
          LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards LANG=C ./test
      - name: Test g++-14 with C.UTF-8 locale, should FAIL
        if: always()
        shell: omnios {0}
        run: |
          g++-14 -v
          g++-14 -std=c++20 test.cpp -o test
          LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards LANG=C.UTF-8 ./test
          mdb ./test core <<'EOF'
          $G
          ::status
          $C
          EOF
      - name: Test g++-15 with C locale, should PASS
        if: always()
        shell: omnios {0}
        run: |
          g++-15 -v
          g++-15 -std=c++20 test.cpp -o test
          LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards LANG=C ./test
      - name: Test g++-15 with C.UTF-8 locale, should FAIL
        if: always()
        shell: omnios {0}
        run: |
          g++-15 -v
          g++-15 -std=c++20 test.cpp -o test
          LD_PRELOAD=libumem.so.1 UMEM_DEBUG=guards LANG=C.UTF-8 ./test
          mdb ./test core <<'EOF'
          $G
          ::status
          $C
          EOF
