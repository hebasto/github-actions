name: CI
on: push

jobs:
  pr-chain:
    runs-on: ubuntu-latest

    steps:
      - name: View context attributes
        uses: actions/github-script@v8
        with:
          script: console.log(context)

      - name: Fetch All Open PRs
        id: fetch_prs
        uses: actions/github-script@v8
        with:
          script: |
            const all_pulls = await github.paginate(github.rest.pulls.list, {
              owner: 'bitcoin',
              repo: 'bitcoin',
              state: 'open',
              per_page: 100
            });

            console.log(`Found ${all_pulls.length} open PRs.`);
