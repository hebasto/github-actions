name: CI
on: push

jobs:
  pr-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch All Open PRs
        id: fetch_prs
        uses: actions/github-script@v8
        with:
          script: |
            const all_pulls = await github.paginate(github.rest.pulls.list, {
              owner: 'bitcoin',
              repo: 'bitcoin',
              state: 'open',
              per_page: 100
            });

            const candidates = all_pulls
              .filter(pr => !pr.draft)
              .map(pr => pr.number);

            console.log(`Found ${candidates.length} open, non-draft PRs.`);
