name: Check
on: push

jobs:
  netbsd:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '10.1'

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          disable-cache: true
          prepare: |
            pkg_add python313
          run: |
            python3.13 --version
            python3.13 -m ensurepip
            python3.13 -c "import site; import os; print(os.path.join(site.USER_BASE, 'bin'))"
            python3.13 -c "import sysconfig; print(sysconfig.get_path('scripts'))"
