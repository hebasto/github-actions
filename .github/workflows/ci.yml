on: push

jobs:
  matrix_names:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - env_vars: { WIDEMUL: 'int64',  RECOVERY: 'yes' }
          - env_vars: { BUILD: 'distcheck', WITH_VALGRIND: 'no' }
          - env_vars: { ECMULTGENPRECISION: 8, ECMULTWINDOW: 4 }
        cc: ['gcc', 'clang']

    env:
      CC: ${{ matrix.cc }}

    steps:
      - run: |
          echo "WIDEMUL=${{ matrix.configuration.env_vars.WIDEMUL }}"
          echo "RECOVERY=${{ matrix.configuration.env_vars.RECOVERY }}"
          echo "BUILD=${{ matrix.configuration.env_vars.BUILD }}"
          echo "WITH_VALGRIND=${{ matrix.configuration.env_vars.WITH_VALGRIND }}"
          echo "ECMULTGENPRECISION=${{ matrix.configuration.env_vars.ECMULTGENPRECISION }}"
          echo "ECMULTWINDOW=${{ matrix.configuration.env_vars.ECMULTWINDOW }}"

          printenv CC
