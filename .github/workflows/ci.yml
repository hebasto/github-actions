name: CI
on: push

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['14.4', '15.1']
    steps:
      - name: FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          sync: no
          prepare: |
            pkg update
            pkg install -y bash curl gmake
            tar --version
          run: |
            curl --location --fail --output source.tar.gz https://github.com/bitcoin/bitcoin/archive/refs/heads/master.tar.gz
            mkdir bitcoin
            tar -xf source.tar.gz -C bitcoin --strip-components=1
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_recipe_hash
            rm -rf bitcoin
            curl --location --fail --output source.tar.gz https://github.com/bitcoin/bitcoin/archive/refs/heads/master.tar.gz
            mkdir bitcoin
            tar -xf source.tar.gz -C bitcoin --strip-components=1
            gmake --no-print-directory -C bitcoin/depends print-native_libmultiprocess_recipe_hash
