name: CI
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:stable

    steps:
      - run: |
          apt-get update
          apt-get install -y python3

      - run: |
          #!/usr/bin/env python3
          import hashlib
          import sys
          print(hashlib.algorithms_available)
          print(f"Python Version: {sys.version}")
        shell: python
