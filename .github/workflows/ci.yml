name: CI
on: push

jobs:
  NetBSD:
    name: 'NetBSD ${{ matrix.release }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '9.4'
            capnproto-cppflags: '-DKJ_USE_KQUEUE=0'
            zeromq-cppflags: '-DZMQ_NETBSD_KEVENT_UDATA_INTPTR_T=1'
            pcre2-action: 'install'
          - release: '10.1'
            pcre2-action: 'replace'

    steps:
      - name: Start NetBSD ${{ matrix.release }} VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          run: |
            pkg_add curl
            pkg_add mozilla-rootcerts-openssl
            pkg_add cmake
            pkg_add ninja-build
            pkg_add git-base
            pkg_add gcc14
            pkg_add pkgconf
            pkg_add boost
            pkg_add libevent
            pkg_add sqlite3
            pkg_add zeromq
            pkg_add python313
            pkg_add py313-zmq
