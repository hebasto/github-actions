name: CI
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - run: python3 --version

      - run: |
          import hashlib
          print(hashlib.algorithms_available)
        shell: python

      - run: |
          openssl version
          openssl version -d
          cat /usr/lib/ssl/openssl.cnf

      - run: |
          sudo sed -i '/default = default_sect/a\legacy = legacy_sect' /usr/lib/ssl/openssl.cnf
          echo "" | sudo tee -a /usr/lib/ssl/openssl.cnf
          echo "[default_sect]" | sudo tee -a /usr/lib/ssl/openssl.cnf
          echo "activate = 1" | sudo tee -a /usr/lib/ssl/openssl.cnf
          echo "" | sudo tee -a /usr/lib/ssl/openssl.cnf
          echo "[legacy_sect]" | sudo tee -a /usr/lib/ssl/openssl.cnf
          echo "activate = 1" | sudo tee -a /usr/lib/ssl/openssl.cnf

      - run: |
          cat /usr/lib/ssl/openssl.cnf

      - run: |
          import hashlib
          print(hashlib.algorithms_available)
        shell: python
