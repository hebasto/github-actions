on: push

jobs:
  docker:
    # name: 'Build image'
    runs-on: ubuntu-latest
    steps:
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v2
      - uses: actions/checkout@v3

      - uses: docker/build-push-action@v4
        with:
          file: ./Dockerfile
          tags: ci-image
          push: false
          load: true
          # cache-from: type=gha
          # cache-to: type=gha,mode=min

      - run: |
          ls -l ${{ github.workspace }}

      - run: >
          docker run --workdir ${{ github.workspace }} -v ${{ github.workspace }}:${{ github.workspace }} ci-image bash -c " \
            pwd && \
            ls -l && \
            touch heba && \
            ls -l \
          "

      - run: >
          docker run --workdir ${{ github.workspace }} -v ${{ github.workspace }}:${{ github.workspace }} ci-image bash -c " \
            pwd && \
            ls -l \
          "
