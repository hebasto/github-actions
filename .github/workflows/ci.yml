on: push

jobs:
  matrix_names:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        - job_prefix: 'x86_64'
          env_vars:
            HOST: 'x86_64-w64-mingw32'
        - job_prefix: 'i686'
          env_vars:
            HOST: 'i686-w64-mingw32'

    env: ${{ matrix.env_vars }}

    steps:
      - run: |
          echo "job_prefix=${{ matrix.job_prefix }}"
