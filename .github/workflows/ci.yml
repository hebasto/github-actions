name: CI
on: push

jobs:
  FreeBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y cmake
          run: cmake --version
          sync: 'rsync'
          copyback: false

      - shell: freebsd {0}
        run: |
          cd ${{ github.workspace }}
          cmake -B build
