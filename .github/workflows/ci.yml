name: CI
on: push

jobs:
  NetBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          prepare: |
            echo "+++++++++++++++++++++++++++ prepare 00"
            echo $PKG_PATH
            echo "+++++++++++++++++++++++++++ prepare 01"
            ls -l /usr/
            echo "+++++++++++++++++++++++++++ prepare 02"
            ftp https://cdn.netbsd.org/pub/pkgsrc/stable/pkgsrc.tar.xz
            tar -xzf pkgsrc.tar.gz -C /usr/
            echo "+++++++++++++++++++++++++++ prepare 03"
            ls -l /usr/
            echo "+++++++++++++++++++++++++++ prepare 04"
            env -u PKG_PATH make -C /usr/pkgsrc/devel/pcre2/ install
            echo "+++++++++++++++++++++++++++ prepare 05"
            pkg_info > packages_before
            echo "+++++++++++++++++++++++++++ prepare 06"
            pkg_add git-base
            echo "+++++++++++++++++++++++++++ prepare 07"
            pkg_info > packages_after
            echo "+++++++++++++++++++++++++++ prepare 08"
            diff -w packages_before packages_after | grep '^>'
            echo "+++++++++++++++++++++++++++ prepare 09"
          sync: no
