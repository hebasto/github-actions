on: push

jobs:
  check-error:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger an error
        id: trigger
        continue-on-error: true
        run: |
          ls unknown-entity

      - name: Results
        if: ${{ always()  }}
        run: |
          echo '${{ steps.trigger.outcome }}'
          echo '${{ steps.trigger.conclusion }}'
