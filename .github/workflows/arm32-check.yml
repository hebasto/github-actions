name: arm32-check
on:
  push:
    branches:
      - '251030-arm32-check'
  workflow_dispatch:

jobs:
  arm32:
    name: '${{ matrix.runner }} #${{ matrix.sample }}'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['ubuntu-24.04-arm', 'ubuntu-22.04-arm']
        sample: [1, 2, 3, 4]
    steps:
      - name: CPU identification
        run: |
          uname -a
          echo "--- lscpu"
          lscpu
          echo "--- /proc/cpuinfo (cpu0)"
          sed -n '1,/^$/p' /proc/cpuinfo
          echo "--- MIDR_EL1"
          cat /sys/devices/system/cpu/cpu0/regs/identification/midr_el1 || true

      - name: Kernel compat support
        run: |
          echo "--- CONFIG_COMPAT in kernel config"
          grep -E '^CONFIG_COMPAT=|^CONFIG_ARMV8_DEPRECATED|^CONFIG_COMPAT_32BIT_TIME' /boot/config-"$(uname -r)" || echo "no CONFIG_COMPAT entry found"
          echo "--- binfmt_misc entries (would indicate emulation, not native)"
          ls -la /proc/sys/fs/binfmt_misc/ 2>/dev/null || true
          echo "--- compat hwcaps as seen by a 32-bit personality"
          setarch linux32 cat /proc/cpuinfo | sed -n '1,/^$/p' || true

      - name: ID_AA64PFR0_EL1.EL0 (hardware AArch32 capability)
        run: |
          cat > idreg.c <<'EOC'
          #include <stdio.h>
          #include <stdint.h>
          int main(void) {
            uint64_t pfr0;
            __asm__ volatile("mrs %0, ID_AA64PFR0_EL1" : "=r"(pfr0));
            unsigned el0 = pfr0 & 0xf, el1 = (pfr0 >> 4) & 0xf;
            printf("ID_AA64PFR0_EL1 = 0x%016llx\n", (unsigned long long)pfr0);
            printf("EL0 field = 0x%x (%s)\n", el0, el0 == 2 ? "AArch64 and AArch32" : el0 == 1 ? "AArch64 only" : "unknown");
            printf("EL1 field = 0x%x (%s)\n", el1, el1 == 2 ? "AArch64 and AArch32" : el1 == 1 ? "AArch64 only" : "unknown");
            return 0;
          }
          EOC
          gcc -O0 -o idreg idreg.c && ./idreg

      - name: Run a native 32-bit (armhf) binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf > /dev/null
          cat > hello32.c <<'EOC'
          #include <stdio.h>
          int main(void) { printf("hello from a %zu-bit process\n", sizeof(void *) * 8); return 0; }
          EOC
          arm-linux-gnueabihf-gcc -static -o hello32 hello32.c
          file hello32
          if ./hello32; then
            echo "RESULT: 32-bit ARM (AArch32) execution IS available on this runner"
          else
            rc=$?
            echo "RESULT: 32-bit ARM (AArch32) execution is NOT available on this runner (exit code $rc)"
            exit 1
          fi
