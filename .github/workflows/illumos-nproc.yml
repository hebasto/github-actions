name: illumos nproc probe
on:
  push:
    branches: ['261024-illumos-nproc']
  workflow_dispatch:

env:
  YAML_KEY_01: &PROBE_SCRIPT |
    echo "PATH=$PATH"
    echo "--- command -v nproc"
    command -v nproc || echo "nproc: not found"
    echo "--- nproc"
    nproc || true
    echo "--- /usr/gnu/bin/nproc"
    /usr/gnu/bin/nproc || echo "/usr/gnu/bin/nproc: not found"
    echo "--- psrinfo | wc -l"
    psrinfo | wc -l
    echo "--- getconf NPROCESSORS_ONLN"
    getconf NPROCESSORS_ONLN || true
    echo "--- package owning /usr/gnu/bin/nproc"
    pkg search -l -H -o pkg.name 'path:usr/gnu/bin/nproc' || true

jobs:
  omnios:
    name: 'OmniOS r151058'
    runs-on: ubuntu-latest
    steps:
      - name: Host CPU count
        run: nproc
      - name: Start VM
        uses: vmactions/omnios-vm@v1
        with:
          release: 'r151058'
          sync: no
          disable-cache: true
      - name: Probe nproc in the VM
        shell: omnios {0}
        run: *PROBE_SCRIPT

  openindiana:
    name: 'OpenIndiana 202604-build'
    runs-on: ubuntu-latest
    steps:
      - name: Host CPU count
        run: nproc
      - name: Start VM
        uses: vmactions/openindiana-vm@v1
        with:
          release: '202604-build'
          sync: no
          disable-cache: true
      - name: Probe nproc in the VM
        shell: openindiana {0}
        run: *PROBE_SCRIPT
